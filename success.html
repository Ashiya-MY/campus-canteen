<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="success-section">

        <div class="success-card">

            <h1>Order Confirmed</h1>

            <p>Your food order has been placed successfully.</p>

            <h3 id="tokenNumber"></h3>

            <p id="orderTotal"></p>

            <p id="orderTime"></p>

            <a href="index.html">
                <button>Back to Home</button>
            </a>

        </div>

    </section>

    <script>

        window.onload = function(){

            document.getElementById("tokenNumber").innerText =
            "Token Number: " +
            localStorage.getItem("orderToken");

            document.getElementById("orderTotal").innerText =
            "Total Amount: " +
            localStorage.getItem("orderTotal");

            document.getElementById("orderTime").innerText =
            "Pickup Time: " +
            localStorage.getItem("orderTime");

        }

        </script>
</body>
</html>
