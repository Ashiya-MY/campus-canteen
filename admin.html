<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">

        <h1 class="logo">
            Admin Panel
        </h1>

    </nav>
    <div class="back-btn-container">

    <a href="index.html">

        <button class="back-btn">
            ← Back to Home
        </button>

    </a>

</div>

    <section class="admin-section">

        <h2>Manage Food Items</h2>

        <!-- ADD ITEM BOX -->

<div class="add-item-box">

    <h3>Add New Item</h3>

    <input type="text"
    placeholder="Food Name">

    <input type="number"
    placeholder="Price">

    <select>

        <option>Breakfast</option>

        <option>Lunch</option>

        <option>Snacks</option>

    </select>

    <button>
        Add Item
    </button>

</div>

        <!-- FOOD ITEM -->

<div class="admin-card">

    <div>

        <h3>Veg Burger</h3>

        <p>Category: Snacks</p>

        <p id="burgerText" class="available-text">
            Available
        </p>

    </div>

    <label class="switch">

        <input type="checkbox"
        id="burgerToggle"
        onchange="toggleAvailability(this,'burger','burgerText')">

        <span class="slider"></span>

    </label>

</div>

        <!-- FOOD ITEM -->

<div class="admin-card">

    <div>

        <h3>Masala Dosa</h3>

        <p>Category: Breakfast</p>

        <p id="dosaText" class="available-text">
            Available
        </p>

    </div>

    <label class="switch">

        <input type="checkbox"
        id="dosaToggle"
        onchange="toggleAvailability(this,'dosa','dosaText')">

        <span class="slider"></span>

    </label>

</div>

        <!-- FOOD ITEM -->

 <div class="admin-card">

    <div>

        <h3>Sandwich</h3>

        <p>Category: Lunch</p>

        <p id="sandwichText"
        class="available-text">
            Available
        </p>

    </div>

    <label class="switch">

        <input type="checkbox"
        id="sandwichToggle"
        onchange="toggleAvailability(this,'sandwich','sandwichText')">

        <span class="slider"></span>

    </label>

</div>

    </section>
    <footer class="footer">

        <h3>Smart College Canteen</h3>

    </footer>

    <script src="js/script.js"></script>
     
  <script>

  window.onload = function(){

    let items = [
        "burger",
        "dosa",
        "sandwich"
    ];

    items.forEach(item => {

        let availability =
        localStorage.getItem(item);

        let toggle =
        document.getElementById(item + "Toggle");

        let text =
        document.getElementById(item + "Text");

        if(availability === "Unavailable"){

            toggle.checked = false;

            text.innerText = "Unavailable";

            text.style.color = "red";

        }

        else{

            toggle.checked = true;

            text.innerText = "Available";

            text.style.color = "green";

        }

    });

}

</script>
</body>
</html>
